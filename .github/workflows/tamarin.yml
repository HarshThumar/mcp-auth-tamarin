name: tamarin

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  TAMARIN_VERSION: "1.12.0"
  MAUDE_VERSION: "3.5.1"

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lint model headers
        run: bash scripts/check-model-header.sh

      - name: Cache Maude and Tamarin binaries
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/tools
          key: tools-tamarin-${{ env.TAMARIN_VERSION }}-maude-${{ env.MAUDE_VERSION }}

      - name: Install Maude and Tamarin (release binaries)
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools/bin" "$HOME/tools/maude"
          cd "$HOME/tools"
          curl -sSL -o maude.zip "https://github.com/maude-lang/Maude/releases/download/Maude${MAUDE_VERSION}/Maude-${MAUDE_VERSION}-linux-x86_64.zip"
          unzip -q maude.zip -d maude-unzipped
          find maude-unzipped -type f \( -name 'maude' -o -name '*.maude' \) -exec cp {} maude/ \;
          chmod +x maude/maude
          ln -sf "$HOME/tools/maude/maude" bin/maude
          curl -sSL -o tamarin.tar.gz "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz"
          tar xzf tamarin.tar.gz -C bin
          chmod +x bin/tamarin-prover

      - name: Set environment paths
        run: |
          chmod +x "$HOME/tools/bin/"* || true
          echo "$HOME/tools/bin" >> "$GITHUB_PATH"
          echo "MAUDE_LIB=$HOME/tools/maude" >> "$GITHUB_ENV"

      - name: Versions
        run: |
          maude --version
          tamarin-prover --version | head -3

      - name: Prove all models
        run: bash scripts/prove.sh

      - name: Upload Tamarin output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamarin-results
          path: results/
